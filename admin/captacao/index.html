<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Captação | Grand Focus</title><link rel="icon" href="/assets/logo-icone.png"><link rel="stylesheet" href="/landing/landing.css"><script defer src="/landing/config.js"></script><script defer src="/landing/crm.js"></script></head><body><header class="top"><a class="brand" href="/"><img src="/assets/logo-icone.png" alt="" width="44" height="44">Grand Focus</a><button class="btn small" id="logout" hidden>Sair</button></header><main class="section paper"><div class="wrap"><p class="eyebrow">ADMINISTRAÇÃO · SUPER ADMIN</p><h1>Captação de clientes</h1><p>Interesses de escolas e bailarinos, em fluxos separados. Acesso restrito ao super administrador.</p><div class="form-card" id="login-card"><form id="login" autocomplete="on"><label class="field"><span>E-mail de autenticação do super administrador</span><input type="email" name="email" autocomplete="username" required></label><label class="field"><span>Senha</span><input type="password" name="password" autocomplete="current-password" required></label><button class="btn submit" type="submit">Entrar</button><p id="login-message" role="status"></p></form></div><section id="dashboard" hidden><div class="crm-filters"><label class="field"><span>Funil</span><select id="funnel"><option value="b2b">Escolas — B2B</option><option value="b2c">Ensaios — B2C</option></select></label><label class="field"><span>Registros</span><select id="test"><option value="true">Testes</option><option value="false">Reais</option></select></label><label class="field"><span>Status</span><select id="status"><option value="">Todos</option></select></label><label class="field"><span>Cidade</span><input id="city" maxlength="100"></label><label class="field"><span>Variante</span><select id="variant"><option value="">Todas</option><option value="a">A</option><option value="b">B</option><option value="original">Original</option></select></label><label class="field"><span>Origem (UTM)</span><input id="source" maxlength="100"></label><label class="field"><span>Desde</span><input type="date" id="date"></label><button class="btn" id="filter">Filtrar</button><button class="outline" id="export">Exportar página CSV</button></div><div class="crm-toolbar"><span id="count" role="status"></span><button class="outline" id="previous">Anterior</button><button class="outline" id="next">Próxima</button></div><div id="results" class="crm-results"></div><p id="crm-message" role="status"></p></section></div></main><footer class="footer"><div class="wrap">Grand Focus · Gestão de captação</div></footer></body></html>
